<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  /* ═══ LUMIÈRE ═════════════════════════════════
     루미에르홀 리서치 기반: 아이보리·대리석, 아치 통창,
     크리스탈 샹들리에, 황동, 블러쉬 플라워, 월넛 도어 */
  :root {
    --ivory: #FDFBF6;
    --marble: #F5F1E8;
    --vein: #E9E3D4;
    --brass: #B08D57;
    --brass-soft: #C9AE7E;
    --brass-deep: #7D5F32;
    --blush: #E5C2C6;
    --blush-deep: #985D68;
    --walnut: #52402F;
    --ink: #37312A;
    --ink-soft: #6B6355;
    --serif-kr: "Gowun Batang", "Nanum Myeongjo", "Apple Myungjo", Batang, serif;
    --serif-la: "Cormorant Garamond", "Gowun Batang", serif;
    --sans: "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { background: var(--marble); scroll-behavior: smooth; }
  body {
    background: var(--marble);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
    letter-spacing: 0;
    word-break: keep-all;
    overflow-wrap: anywhere;
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  .page {
    max-width: 430px;
    margin: 0 auto;
    background:
      /* 은은한 대리석 결 */
      radial-gradient(ellipse 400px 300px at 85% 12%, rgba(233, 227, 212, 0.5), transparent 70%),
      radial-gradient(ellipse 500px 380px at 8% 55%, rgba(233, 227, 212, 0.35), transparent 70%),
      radial-gradient(ellipse 360px 280px at 90% 85%, rgba(229, 194, 198, 0.10), transparent 70%),
      var(--ivory);
    box-shadow: 0 0 56px rgba(55, 49, 42, 0.12);
    overflow: hidden;
  }

  .draft-badge {
    position: sticky; top: 0; z-index: 20;
    background: var(--walnut);
    color: var(--ivory);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-align: center;
    padding: 6px 12px;
  }

  section { padding: 84px 30px; position: relative; }

  /* ── 섹션 디바이더 — 생성 일러스트 ────────── */
  .divider-art {
    display: block;
    width: min(238px, 64vw);
    height: auto;
    margin: 0 auto 18px;
    filter: saturate(0.92);
  }
  .eyebrow {
    display: block;
    font-family: var(--serif-la);
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.46em;
    text-indent: 0.46em;
    color: var(--brass-deep);
    text-align: center;
    margin-bottom: 8px;
  }

  .section-heading {
    text-align: center;
    margin-bottom: 36px;
  }
  .section-heading h2 {
    margin: 0;
    font-size: 20px;
  }

  h2 {
    font-family: var(--serif-kr);
    font-weight: 700;
    font-size: 21px;
    text-align: center;
    text-wrap: balance;
    margin-bottom: 30px;
    letter-spacing: 0.02em;
  }

  /* ═══ 표지 ════════════════════════════════════ */
  .cover {
    min-height: calc(100vh - 32px);
    min-height: calc(100svh - 32px);
    padding: 14px 30px 8px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  /* 정오의 빛줄기 */
  .cover .rays {
    position: absolute;
    inset: -20% -30%;
    background:
      linear-gradient(118deg, transparent 32%, rgba(255, 241, 205, 0.36) 45%, transparent 57%),
      linear-gradient(62deg, transparent 43%, rgba(255, 244, 216, 0.24) 56%, transparent 68%);
    filter: blur(18px);
    animation: shimmer 14s ease-in-out infinite alternate;
    pointer-events: none;
  }
  @keyframes shimmer {
    from { opacity: 0.58; transform: translateX(-8px); }
    to   { opacity: 0.92; transform: translateX(8px); }
  }
  /* 진입 연출: 어스름 → 햇살이 쓸고 지나가며 밝아짐 */
  .cover .veil {
    position: absolute;
    inset: 0;
    background: linear-gradient(160deg, rgba(72, 58, 38, 0.16), rgba(72, 58, 38, 0.08));
    pointer-events: none;
    z-index: 2;
  }
  html.js body.loaded .cover .veil { animation: liftveil 2.4s ease-out forwards; }
  @keyframes liftveil {
    0%   { opacity: 1; }
    45%  { opacity: 0.85; }
    100% { opacity: 0; }
  }
  .cover .sunbeam {
    position: absolute;
    inset: -12% -30%;
    background: linear-gradient(112deg,
      transparent 24%,
      rgba(255, 238, 190, 0.48) 40%,
      rgba(255, 247, 222, 0.34) 50%,
      transparent 66%);
    filter: blur(13px);
    opacity: 0;
    pointer-events: none;
    z-index: 2;
  }
  html.js body.loaded .cover .sunbeam { animation: sunbeam 2.6s ease-out forwards; }
  @keyframes sunbeam {
    0%   { opacity: 0; transform: translateX(-46%); }
    30%  { opacity: 1; }
    72%  { opacity: 0.8; transform: translateX(6%); }
    100% { opacity: 0; transform: translateX(12%); }
  }
  .cover canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  .cover .fg { position: relative; z-index: 1; }

  /* 천장 스트링 라이트 — 실제 홀 천장의 전구 라인 */
  .string-lights {
    position: absolute;
    top: 34px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 22px;
    z-index: 1;
    opacity: 0.42;
  }
  .string-lights i {
    width: 3px; height: 3px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #FFF8E4, var(--brass-soft));
    box-shadow: 0 0 7px rgba(201, 174, 126, 0.62);
    animation: twinkle 3.4s ease-in-out infinite;
  }
  /* 완만한 드리움 곡선 */
  .string-lights i:nth-child(1), .string-lights i:nth-child(11) { transform: translateY(0); }
  .string-lights i:nth-child(2), .string-lights i:nth-child(10) { transform: translateY(4px);  animation-delay: 0.3s; }
  .string-lights i:nth-child(3), .string-lights i:nth-child(9)  { transform: translateY(7px);  animation-delay: 0.6s; }
  .string-lights i:nth-child(4), .string-lights i:nth-child(8)  { transform: translateY(9px);  animation-delay: 0.9s; }
  .string-lights i:nth-child(5), .string-lights i:nth-child(7)  { transform: translateY(10.5px); animation-delay: 1.2s; }
  .string-lights i:nth-child(6) { transform: translateY(11px); animation-delay: 1.5s; }

  /* 샹들리에 */
  .chandelier-art {
    position: relative;
    margin-bottom: -8px;
  }
  .chandelier-art img {
    display: block;
    width: min(175px, 45vw);
    height: auto;
    margin: 0 auto;
    transform-origin: 50% 2%;
    will-change: transform;
    filter: saturate(0.9) brightness(1.03) contrast(0.96)
            drop-shadow(0 10px 24px rgba(143, 112, 64, 0.26));
  }
  /* 은은한 빛 번짐 펄스 */
  .chandelier-art::before {
    content: "";
    position: absolute;
    left: 50%; top: 47%;
    width: 280px; height: 190px;
    margin: -95px 0 0 -140px;
    border-radius: 50%;
    background: radial-gradient(ellipse, rgba(255, 243, 210, 0.32), transparent 70%);
    z-index: -1;
    animation: glowpulse 5.6s ease-in-out infinite;
  }
  @keyframes glowpulse {
    0%, 100% { opacity: 0.58; transform: scale(0.98); }
    50%      { opacity: 0.9; transform: scale(1.03); }
  }
  @keyframes twinkle {
    0%, 100% { box-shadow: 0 0 8px rgba(201, 174, 126, 0.45); }
    50%      { box-shadow: 0 0 18px rgba(201, 174, 126, 0.95); }
  }

  /* 아치 통창 — 생성 일러스트 */
  .arch-art {
    position: relative;
    width: min(248px, 64vw);
    margin: 0 auto 6px;
  }
  .arch-art img {
    display: block;
    width: 100%;
    height: auto;
    filter: saturate(0.85) drop-shadow(0 22px 40px rgba(82, 64, 47, 0.20));
  }
  /* 유리면 텍스트 오버레이 — 유리 전체를 덮고 글로우는 중앙에서만 피어나게
     (좁은 박스 + 가장자리 잘린 그라데이션 → 네모 스티커처럼 보이던 문제 수정) */
  .arch-art .inner {
    position: absolute;
    left: 7%; right: 7%;
    top: 8%; bottom: 7%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding-top: 17%;
    gap: 16px;
    background: radial-gradient(ellipse 62% 32% at 50% 58%,
      rgba(252, 248, 237, 0.95) 32%, rgba(252, 248, 237, 0) 74%);
  }
  .arch-art .small-word {
    font-family: var(--serif-kr);
    font-size: 12px;
    letter-spacing: 0.32em;
    text-indent: 0.32em;
    color: var(--brass-deep);
    white-space: nowrap;
    /* 창살 위 가독성 확보용 아이보리 헤일로 */
    text-shadow:
      0 0 6px rgba(252, 248, 237, 1), 0 0 10px rgba(252, 248, 237, 1),
      0 0 16px rgba(252, 248, 237, 0.9), 0 0 24px rgba(252, 248, 237, 0.8);
  }
  .arch-art .names-line {
    font-family: var(--serif-kr);
    font-size: 30px;
    font-weight: 700;
    letter-spacing: 0.14em;
    line-height: 1.6;
    color: var(--ink);
  }
  .arch-art .names-line .and {
    display: block;
    font-family: var(--serif-kr);
    font-weight: 400;
    font-size: 13px;
    color: var(--blush-deep);
    letter-spacing: 0.34em;
    text-indent: 0.34em;
    padding: 4px 0;
  }

  .cover .date-line {
    font-family: var(--serif-la);
    font-size: 17px;
    font-weight: 500;
    letter-spacing: 0.34em;
    text-indent: 0.34em;
    color: var(--ink);
    margin-bottom: 10px;
    font-variant-numeric: tabular-nums;
  }
  .cover .venue-line {
    font-size: 14px;
    color: var(--ink-soft);
    line-height: 2;
  }
  .cover .venue-line strong { color: var(--ink); font-weight: 600; }

  .scroll-hint {
    margin-top: 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .scroll-hint::before {
    content: "";
    width: 1px;
    height: 14px;
    background: linear-gradient(var(--brass), transparent);
    animation: drip 2.2s ease-in-out infinite;
  }
  @keyframes drip {
    0%   { transform: scaleY(0); transform-origin: top; }
    55%  { transform: scaleY(1); transform-origin: top; }
    100% { transform: scaleY(1); opacity: 0; }
  }
  .scroll-hint span {
    font-family: var(--serif-la);
    font-size: 10px;
    letter-spacing: 0.4em;
    text-indent: 0.4em;
    color: var(--ink-soft);
  }

  /* 표지 등장 시퀀스는 React Motion이 담당 */
  .cover .fg { will-change: opacity, transform; }

  /* ── 블러쉬 로즈 갈란드 — 생성 일러스트 ───── */
  .garland-art {
    display: block;
    width: min(250px, 66vw);
    height: auto;
    margin: 30px auto 0;
    filter: saturate(0.92);
  }

  /* ═══ 인터루드 ═══════════════════════════════ */
  .interlude {
    padding: 96px 30px;
    text-align: center;
    background: linear-gradient(rgba(176, 141, 87, 0.05), transparent 55%);
  }
  .interlude p {
    font-family: var(--serif-kr);
    font-size: 20px;
    font-weight: 700;
    line-height: 2.1;
    text-wrap: balance;
    color: var(--ink);
  }
  .interlude .la {
    display: block;
    margin-top: 20px;
    font-family: var(--serif-la);
    font-style: italic;
    font-weight: 400;
    font-size: 14px;
    letter-spacing: 0.2em;
    color: var(--brass-deep);
  }

  /* ═══ 인사말 ═════════════════════════════════ */
  .greeting { border-top: 1px solid var(--vein); padding-top: 100px; padding-bottom: 100px; }
  .greeting p {
    font-family: var(--serif-kr);
    text-align: center;
    font-size: 16px;
    line-height: 2.35;
  }
  .greeting p + p { margin-top: 28px; }
  .greeting .light-word { color: var(--brass-deep); }
  .parents {
    margin-top: 52px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    align-items: center;
    font-size: 14.5px;
    color: var(--ink-soft);
  }
  .parents p,
  .parents p + p {
    margin: 0;
    line-height: 1.9;
  }
  .parents strong {
    color: var(--ink);
    font-weight: 700;
    font-family: var(--serif-kr);
    margin-left: 8px;
    font-size: 16px;
  }
  .couple-sign {
    margin-top: 44px;
    text-align: center;
    font-family: var(--serif-kr);
    font-size: 16px;
    color: var(--ink);
  }

  /* ═══ 예식 안내 ══════════════════════════════ */
  .when-where { text-align: center; border-top: 1px solid var(--vein); }
  .when-where .big-date {
    font-family: var(--serif-kr);
    font-size: 21px;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .when-where .time { color: var(--ink-soft); font-size: 15px; margin-bottom: 48px; }

  /* 달력 오네이트 프레임 */
  .calendar-frame {
    position: relative;
    max-width: 356px;
    margin: 0 auto 44px;
    padding: 28px 16px 24px;
    border: 1px solid var(--vein);
  }
  .calendar-frame > i {
    position: absolute;
    width: 5px; height: 5px;
    background: var(--brass);
    transform: rotate(45deg);
  }
  .calendar-frame > i:nth-child(1) { top: -3px; left: -3px; }
  .calendar-frame > i:nth-child(2) { top: -3px; right: -3px; }
  .calendar-frame > i:nth-child(3) { bottom: -3px; left: -3px; }
  .calendar-frame > i:nth-child(4) { bottom: -3px; right: -3px; }

  .calendar {
    width: 100%;
    max-width: 322px;
    margin: 0 auto;
    border-collapse: collapse;
    table-layout: fixed;
    font-variant-numeric: tabular-nums;
  }
  .calendar caption {
    font-family: var(--serif-la);
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.4em;
    text-indent: 0.4em;
    padding-bottom: 20px;
    color: var(--brass-deep);
  }
  .calendar th {
    font-family: var(--serif-la);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.1em;
    color: var(--ink-soft);
    padding-bottom: 14px;
  }
  .calendar th.sun { color: var(--blush-deep); }
  .calendar td {
    width: 14.2857%;
    height: 44px;
    font-size: 14.5px;
    text-align: center;
    padding: 0;
    vertical-align: middle;
    color: var(--ink);
  }
  .calendar td.sun { color: var(--blush-deep); }
  .calendar td.dday {
    color: var(--ivory);
    font-weight: 700;
  }
  .calendar td.dday .day-mark {
    position: relative;
    z-index: 0;
    width: 34px;
    height: 34px;
    display: inline-grid;
    place-items: center;
    color: var(--ivory);
    line-height: 1;
  }
  .calendar td.dday .day-mark::before {
    content: "";
    position: absolute;
    width: 34px; height: 34px;
    left: 0; top: 0;
    border-radius: 50%;
    background: var(--brass);
    z-index: -1;
  }
  /* 은은한 링 펄스 */
  .calendar td.dday .day-mark::after {
    content: "";
    position: absolute;
    inset: 0;
    box-sizing: border-box;
    border-radius: 50%;
    border: 1px solid var(--brass);
    animation: ringpulse 3.4s ease-out infinite;
    transform-origin: 50% 50%;
    z-index: -1;
  }
  @keyframes ringpulse {
    from { transform: scale(1); opacity: 0.55; }
    to   { transform: scale(1.45); opacity: 0; }
  }
  .dday-counter { font-size: 15px; color: var(--ink-soft); }
  .dday-counter strong {
    font-family: var(--serif-la);
    display: inline-block;
    min-width: 2.2ch;
    font-size: 31px;
    line-height: 1;
    color: var(--ink);
    font-weight: 500;
    padding: 0 4px;
    font-variant-numeric: lining-nums tabular-nums;
    font-feature-settings: "lnum" 1, "tnum" 1;
  }
  .action-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 26px;
  }
  .action-link {
    min-height: 42px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--brass);
    border-radius: 999px;
    color: var(--brass-deep);
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    background: rgba(253, 251, 246, 0.74);
    transition: background 0.24s ease, color 0.24s ease, border-color 0.24s ease;
  }
  .action-link:hover,
  .action-link:focus-visible {
    background: var(--brass);
    color: var(--ivory);
    border-color: var(--brass);
  }
  .action-link:focus-visible { outline: 2px solid var(--walnut); outline-offset: 2px; }
  .action-link.primary {
    background: var(--brass);
    color: var(--ivory);
  }
  .action-link.primary:hover,
  .action-link.primary:focus-visible { background: var(--brass-deep); border-color: var(--brass-deep); }

  /* ═══ 갤러리 ═════════════════════════════════ */
  .gallery { border-top: 1px solid var(--vein); padding-top: 72px; padding-bottom: 72px; }
  .gallery-hero {
    aspect-ratio: 3 / 3.35;
    border-radius: 999px 999px 0 0;
    border: 1px solid var(--vein);
    background:
      radial-gradient(ellipse 120% 60% at 50% 0%, rgba(255, 243, 210, 0.55), transparent 60%),
      linear-gradient(172deg, #FAF5E9, var(--marble));
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--serif-la);
    font-size: 12px;
    letter-spacing: 0.32em;
    text-indent: 0.32em;
    color: var(--ink-soft);
    margin-bottom: 14px;
    box-shadow: inset 0 0 0 8px var(--ivory), inset 0 0 0 9px rgba(176, 141, 87, 0.35);
  }
  .gallery-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
  }
  .gallery-grid .ph {
    aspect-ratio: 1 / 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--serif-la);
    font-size: 11px;
    letter-spacing: 0.3em;
    text-indent: 0.3em;
    color: var(--ink-soft);
    background: linear-gradient(172deg, #FAF5E9, var(--marble));
    border: 1px solid var(--vein);
  }
  .gallery-note {
    margin-top: 18px;
    font-size: 13px;
    color: var(--ink-soft);
    text-align: center;
  }

  /* ═══ 오시는 길 ══════════════════════════════ */
